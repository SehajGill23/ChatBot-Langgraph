[project]
name = "learn-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gillsehaj533", email = "sgill533@my.bcit.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fastmcp>=3.4.11",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "mcp>=1.30.0",
    "pymupdf>=2.1",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
learn-langgraph = "learn_langgraph:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
